[package]
name = "uxsim-rs"
version = "0.1.0"
edition = "2024"
authors = ["Brandon Hubbard"]
description = "Pure Rust macroscopic city-wide traffic network flow simulator inspired by UXsim"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/uxsim-rs"
keywords = ["traffic", "simulation", "macroscopic", "bevy", "pathfinding"]
categories = ["simulation", "game-development", "algorithms"]

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
